services:
  postgres:
    image: postgres:16
    container_name: practical7-postgres
    environment:
      POSTGRES_USER: cdc_user
      POSTGRES_PASSWORD: cdc_demo_password
      POSTGRES_DB: cdc_lab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
